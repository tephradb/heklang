name: release-plz

# Automated releases (https://release-plz.dev). On every push to main:
#   - `release` publishes any crate whose Cargo.toml version is not yet on crates.io, pushes
#     its git tag, and creates the Forgejo release. Publish order follows the dependency
#     graph: tree-sitter-hek, then heklang, then hek.
#   - `release-pr` keeps a release PR up to date (version bumps + changelogs from the
#     conventional commits since the last release).
#
# The CLI comes from the runner's hostPackages rather than release-plz's own action, which is
# written for GitHub. `--forge gitea` is what points it at this instance: Forgejo speaks the
# Gitea API.
#
# FORGE_TOKEN is a user token with read:repository and write:repository. Using it rather
# than the automatic per-job token is what lets the tags release-plz pushes trigger downstream
# workflows, so a hek release (tagged v{version} by release-plz.toml) fires the binary build.
#
# CARGO_REGISTRY_TOKEN is what authenticates the crates.io publish. On GitHub this was OIDC
# trusted publishing, which has no equivalent here; the trusted publishers registered on
# crates.io against the old repository are dead weight now and can be removed there.
on:
  push:
    branches: [main]

jobs:
  release-plz:
    runs-on: native
    env:
      # **Keep cargo-semver-checks out of `/tmp`.** release-plz runs it to work out whether
      # a bump is breaking, and it builds rustdoc for each crate in a scratch workspace of
      # its own under the system temp dir (`/tmp/.tmpXXXX/hostexecutor/target/semver-checks/
      # local-hek-0_5_5-.../`). The runner sets `PrivateTmp = true`, so that `/tmp` is a
      # systemd tmpfs rather than the disk, and a whole dependency tree does not build in
      # it: first `sccache: encountered fatal error` (exit 254), then, with the wrapper off,
      # `couldn't create a temp dir: No such file or directory` on the rustc metadata
      # tempfile. Both surface three layers up as `failed to determine next versions`.
      #
      # The runner already moves `CARGO_HOME` and `SCCACHE_DIR` to its state directory for
      # related reasons; `TMPDIR` was the one heavy path left pointing at the private tmpfs.
      # The step below sets it, because it has to be on disk **and outside the checkout**:
      # the first attempt put it in the workspace and cargo then read the workspace root
      # above the scratch crate, "current package believes it's in a workspace when it's
      # not". The proper fix is `TMPDIR` beside `SCCACHE_DIR` in the runner's own config,
      # which would cover every repo rather than this one.
      #
      # No sccache here either, and deliberately still off. It failed in the same place for
      # what is probably the same reason, so it may well work once the scratch tree is off
      # the tmpfs, but nothing has shown that yet. Restore it once a release run is green,
      # and take the cold build until then: semver-checks is what turns a breaking change
      # into a minor bump on a 0.x crate, and without it a `feat` alone cuts 0.11.2 where
      # 0.12.0 is owed.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
        with:
          # release-plz reads the whole history to work out what changed since the last tag.
          fetch-depth: 0
          token: ${{ secrets.FORGE_TOKEN }}

      # release-plz commits the version bumps and changelog onto the release branch, and git
      # refuses to commit without an identity.
      #
      # `TMPDIR` is computed here rather than declared above, because it needs a fallback:
      # it must be a real directory on disk (`TMPDIR` naming a missing one is its own `No
      # such file or directory`) and outside `$GITHUB_WORKSPACE`, or cargo finds the
      # workspace root above the scratch crate. `RUNNER_TEMP` is both when the runner sets
      # it; the checkout's parent is the act run directory, which is both either way.
      - name: Configure git identity and the scratch directory
        run: |
          git config user.name "release-plz"
          git config user.email "dev@tqwewe.com"
          scratch="${RUNNER_TEMP:-$(dirname "$GITHUB_WORKSPACE")}/release-plz-scratch"
          rm -rf "$scratch"
          mkdir -p "$scratch"
          echo "TMPDIR=$scratch" >> "$GITHUB_ENV"
          echo "scratch tree: $scratch"

      # Publish + tag + Forgejo release for any crate whose version is unpublished.
      - name: Publish and tag
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: release-plz release --forge gitea --git-token "${{ secrets.FORGE_TOKEN }}"

      # Keep the release PR (version bumps + changelogs) up to date.
      - name: Update the release PR
        run: release-plz release-pr --forge gitea --git-token "${{ secrets.FORGE_TOKEN }}"
