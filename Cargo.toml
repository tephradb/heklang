[package]
name = "heklang"
version = "0.1.0"
edition = "2024"

# `cli` is the `hek` binary. It is not a default member, so bare `cargo run` stays the
# demo rather than becoming ambiguous across two packages holding a binary each; the
# checker is `cargo run -p hek`. Testing everything is `cargo test --workspace`.
[workspace]
members = ["cli"]
default-members = ["."]

[dependencies]
uuid = { version = "1.26.0", default-features = false, features = ["std", "v5"] }

# `harness = false` because this reports allocation counts rather than pass or fail,
# and `test = false` so `cargo test` does not fold a hundred thousand events.
[[bench]]
name = "fold"
harness = false
test = false
