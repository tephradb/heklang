name: release-plz

# Automated releases (https://release-plz.dev). On every push to main:
#   - release-plz-pr keeps a release PR up to date (version bumps + changelogs from the
#     conventional commits since the last release).
#   - release-plz-release publishes any crate whose Cargo.toml version is not yet on
#     crates.io, pushes its git tag, and creates the GitHub release. Publish order follows
#     the dependency graph: tree-sitter-hek, then heklang, then hek.
#
# RELEASE_PLZ_TOKEN is a fine-grained PAT: using it (instead of the default GITHUB_TOKEN) is
# what lets the tags release-plz pushes trigger downstream workflows, so a hek release
# (tagged v{version}) fires the binary build.
#
# crates.io authentication is trusted publishing, so there is no registry token anywhere:
# `id-token: write` lets the release job mint a GitHub OIDC token, and release-plz trades it
# for a short-lived crates.io one itself (which is why rust-lang/crates-io-auth-action is
# not here). Each crate carries a matching trusted publisher on crates.io naming this
# repository and this workflow file.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Publish + tag + GitHub release for any crate whose version is unpublished.
  release-plz-release:
    runs-on: ubuntu-latest
    # A job-level block replaces the workflow-level one, so contents: write is restated.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # Keep the release PR (version bumps + changelogs) up to date.
  release-plz-pr:
    runs-on: ubuntu-latest
    # One release PR at a time; do not cancel an in-progress update.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
